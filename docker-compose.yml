name: pi-hole-monitoring

# Cap container logs so they can't slowly fill the SD card.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.0-distroless
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    logging: *logging
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY in .env}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "${TZ:-Europe/Kyiv}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-false}"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    command:
      - --path.rootfs=/host
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS:-172.17.0.1:9100}
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0
    restart: unless-stopped
    logging: *logging
    environment:
      PIHOLE_HOSTNAME: ${PIHOLE_HOSTNAME:?set PIHOLE_HOSTNAME in .env}
      PIHOLE_PROTOCOL: ${PIHOLE_PROTOCOL:-http}
      PIHOLE_PORT: "${PIHOLE_PORT:-80}"
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

  # Signal account linked as a secondary device; see docs/operations.md.
  # Its entrypoint adjusts users/ownership at startup, so it cannot run with a
  # read-only root filesystem or dropped capabilities like the other services.
  signal-api:
    image: bbernhard/signal-cli-rest-api:0.101
    restart: unless-stopped
    logging: *logging
    environment:
      MODE: normal
    ports:
      # Localhost only: needed once to link the device via the QR code page.
      - "127.0.0.1:${SIGNAL_API_PORT:-8080}:8080"
    volumes:
      - signal-data:/home/.local/share/signal-cli
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

  # Translates Alertmanager webhooks into Signal messages.
  signal-bridge:
    image: python:3.13.16-alpine3.24
    restart: unless-stopped
    logging: *logging
    command: ["python", "-u", "/app/bridge.py"]
    user: "65534:65534"
    environment:
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:?set SIGNAL_NUMBER in .env}
      SIGNAL_RECIPIENTS: ${SIGNAL_RECIPIENTS:?set SIGNAL_RECIPIENTS in .env}
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
    volumes:
      - ./signal-bridge/bridge.py:/app/bridge.py:ro
    depends_on:
      - signal-api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

networks:
  monitoring:
    name: pi-monitoring

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  signal-data:
