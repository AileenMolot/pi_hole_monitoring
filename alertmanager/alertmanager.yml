global:
  resolve_timeout: 5m

route:
  receiver: signal
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Heartbeat for the external dead man's switch (healthchecks.io).
    - matchers:
        - alertname="Watchdog"
      receiver: signal
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m

receivers:
  # signal-bridge forwards alerts to Signal and Watchdog pings to HEALTHCHECKS_URL.
  - name: signal
    webhook_configs:
      - url: http://signal-bridge:8080/
        send_resolved: true

inhibit_rules:
  # When Node Exporter is unreachable, suppress all derived Raspberry Pi alerts
  # to avoid an alert storm from a single root cause.
  - source_matchers:
      - alertname="RaspberryPiExporterDown"
    target_matchers:
      - job="raspberry-pi"
    equal: []
  # When the Pi-hole exporter is unreachable, suppress all derived Pi-hole alerts.
  - source_matchers:
      - alertname="PiholeExporterDown"
    target_matchers:
      - job="pihole"
    equal: []
