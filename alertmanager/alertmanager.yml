route:
  receiver: signal
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Heartbeat for the external dead man's switch (healthchecks.io).
    - matchers:
        - alertname="Watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m

receivers:
  # signal-bridge forwards alerts to Signal and Watchdog pings to HEALTHCHECKS_URL.
  - name: signal
    webhook_configs:
      - url: http://signal-bridge:8080/
